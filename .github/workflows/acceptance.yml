name: Acceptance

on:
  schedule:
    - cron: '17 19 * * 3'
  workflow_dispatch:
    inputs:
      browser_matrix:
        description: Run the synthetic Chromium/WebKit playback matrix
        required: true
        type: boolean
        default: true
      release_package:
        description: Build and validate an ad-hoc signed release DMG
        required: true
        type: boolean
        default: false

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-playback:
    name: Browser · ${{ matrix.browser }} · ${{ matrix.viewport }}
    if: github.event_name == 'schedule' || inputs.browser_matrix
    runs-on: macos-15
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            viewport: 1440x900
          - browser: webkit
            viewport: 390x844
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Select pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install pinned browser harness
        run: npm ci

      - name: Install WebKit runtime
        if: matrix.browser == 'webkit'
        run: npx playwright install webkit

      - name: Ensure synthetic-media toolchain
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Run isolated playback acceptance
        run: |
          scripts/run_web_playback_acceptance.sh \
            --browser '${{ matrix.browser }}' \
            --viewport '${{ matrix.viewport }}' \
            --out-dir '${{ runner.temp }}/medialib-browser-${{ matrix.browser }}'

      - name: Upload redacted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.viewport }}-${{ github.sha }}
          path: ${{ runner.temp }}/medialib-browser-${{ matrix.browser }}
          if-no-files-found: error
          retention-days: 14

  release-package:
    name: Release package · mounted verification
    if: github.event_name == 'workflow_dispatch' && inputs.release_package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Install required media runtimes
        run: brew install mpv ffmpeg

      - name: Build and validate candidate DMG
        env:
          MEDIALIB_PACKAGE_INSTANCE: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/package_dmg.sh

      - name: Verify published image again
        run: hdiutil verify dist/MediaLib.dmg

      - name: Upload candidate image
        uses: actions/upload-artifact@v4
        with:
          name: MediaLib-${{ github.sha }}
          path: dist/MediaLib.dmg
          if-no-files-found: error
          retention-days: 14

  toolchain-upgrade:
    name: Latest toolchain compatibility (non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record and probe the moving toolchain
        run: |
          swift --version
          xcodebuild -version
          python3 scripts/release_metadata.py --check
          swift build --product MediaLib
          swift build --product MediaLibServer
