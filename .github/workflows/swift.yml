name: CI

# 在 push / PR 时跑构建 + 单测 + 集成自检（R4-TEST-001）。
# 需要把项目纳入 git 并推送到 GitHub Actions 才会触发；本地不运行。
#
# 稳定门禁固定到 GitHub macOS 15 镜像明确提供的 Xcode 26.3；新工具链兼容性
# 由 acceptance.yml 的允许失败探针独立报告，不能静默改变 PR 的通过标准。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build · Test · Checks
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Toolchain version
        run: swift --version && xcodebuild -version

      - name: Reject ambiguous Swift sources
        run: bash scripts/check_swift_conflict_copies.sh

      - name: Verify vendored CArgon2
        run: bash scripts/check_cargon2_vendor.sh

      - name: Verify generated release metadata
        run: python3 scripts/release_metadata.py --check

      # 分产物依次构建（而非一次 swift build 全量并行）：CI 上曾出现 MediaLib 链接期找不到
      # MediaLibServerProtocol 的类型符号（undefined symbols），但同一构建里 MediaLibServer
      # 用同一依赖早先已经链接成功——本地用完全相同的 Xcode/Swift 版本复现不出来，判断是
      # Swift Build 在一次调用里并行构建多个共享库依赖的可执行产物时的构建图竞态，不是依赖
      # 声明错误。scripts/package_dmg.sh 一直是分产物顺序调用且从未出现过这个问题，这里改成
      # 同样的顺序结构。
      - name: Build (debug)
        run: |
          swift build --product MediaLib
          swift build --product MediaLibServer
          swift build --product MediaLibChecks

      - name: Unit tests
        run: swift test

      - name: Integration self-check (MediaLibChecks)
        run: swift run MediaLibChecks

  transport-integration:
    name: Real loopback · LAN TLS transport
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Toolchain version
        run: swift --version && xcodebuild -version

      - name: Build server used by the independent client
        run: swift build --product MediaLibServer

      - name: Exercise real listeners and all business methods
        env:
          MEDIALIB_REQUIRE_LAN_E2E: '1'
        run: |
          swift test --filter LANHTTPSServerTests
          swift test --filter ServerModeLANEndToEndTests
